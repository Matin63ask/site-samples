<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <filter id="soil">
    <feTurbulence type="fractalNoise" baseFrequency="0.32" numOctaves="5" seed="3" stitchTiles="stitch" result="n" />
    <feColorMatrix
      in="n"
      type="matrix"
      values="0 0 0 0 0.20
              0 0 0 0 0.15
              0 0 0 0 0.11
              0 0 0 0.55 0"
    />
  </filter>
  <filter id="clods">
    <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="11" stitchTiles="stitch" result="c" />
    <feColorMatrix
      in="c"
      type="matrix"
      values="0 0 0 0 0.09
              0 0 0 0 0.07
              0 0 0 0 0.05
              0 0 0 0.5 0"
    />
  </filter>
  <rect width="640" height="640" filter="url(#soil)" />
  <rect width="640" height="640" filter="url(#clods)" />
</svg>
